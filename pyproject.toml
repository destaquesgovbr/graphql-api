[project]
name = "graphql-api"
version = "0.1.0"
description = "GraphQL API unificada do Destaques Gov.BR"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "strawberry-graphql[fastapi]>=0.262.0",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "typesense>=0.21.0",
    "firebase-admin>=6.6.0",
    "google-auth>=2.38.0",
    "PyJWT[crypto]>=2.10.0",
    "jwcrypto>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphql_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
