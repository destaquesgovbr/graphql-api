site_name: Destaques Gov.BR — GraphQL API
site_description: Documentação profunda da API GraphQL unificada do Destaques Gov.BR
repo_url: https://github.com/destaquesgovbr/graphql-api
repo_name: destaquesgovbr/graphql-api
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: green
      accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Datasources: datasources.md
  - Autenticação: auth.md
  - Subscriptions & SSE: subscriptions-sse.md
  - Exemplos: exemplos.md
  - Referência:
    - Schema (SDL): reference/schema.md
